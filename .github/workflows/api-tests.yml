name: API Tests

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

jobs:
  api-tests:
    name: Run API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: friendssharing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      BOOK_EXCHANGE_API_BASE_URL: http://localhost:8080
      BOOK_EXCHANGE_API_REQUIRE_AVAILABLE: "true"

    steps:
      - name: Checkout API tests
        uses: actions/checkout@v4

      - name: Checkout backend API
        uses: actions/checkout@v4
        with:
          repository: vladwpnz/book-exchange-api
          ref: master
          path: backend

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Ensure database exists
        run: docker exec "${{ job.services.mysql.id }}" mysql -u root -e "CREATE DATABASE IF NOT EXISTS friendssharing;"

      - name: Start backend API
        working-directory: backend
        run: |
          mvn -B spring-boot:run > ../backend.log 2>&1 &
          echo $! > ../backend.pid

      - name: Wait for backend API
        run: |
          for attempt in {1..60}; do
            http_code="$(curl --silent --output /dev/null --write-out "%{http_code}" http://localhost:8080 || true)"

            if [ "$http_code" != "000" ]; then
              echo "Backend API responded with HTTP $http_code"
              exit 0
            fi

            if ! kill -0 "$(cat backend.pid)" 2>/dev/null; then
              echo "Backend API process exited before it became reachable"
              cat backend.log
              exit 1
            fi

            sleep 2
          done

          echo "Backend API did not become reachable at http://localhost:8080"
          cat backend.log
          exit 1

      - name: Run Maven tests
        run: mvn -B test

      - name: Upload Maven Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn
